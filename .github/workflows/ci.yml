name: CI
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build image (amd64) for the smoke test
        uses: docker/build-push-action@v6
        with: { context: ., load: true, tags: "life-os:ci", cache-from: "type=gha", cache-to: "type=gha,mode=max" }
      - name: Smoke test the container
        run: |
          docker image ls life-os:ci
          docker volume create lifeos-ci >/dev/null
          docker run -d --name web -v lifeos-ci:/data -p 3000:3000 life-os:ci
          for i in $(seq 1 60); do s=$(docker inspect -f '{{.State.Health.Status}}' web); [ "$s" = healthy ] && break; sleep 2; done
          echo "health: $s"; [ "$s" = healthy ] || { docker logs web; exit 1; }
          curl -fsS -o /dev/null -w "GET / -> %{http_code}\n" http://127.0.0.1:3000/
          curl -fsS http://127.0.0.1:3000/api/health; echo
          docker run -d --name worker -v lifeos-ci:/data life-os:ci node_modules/.bin/tsx scripts/worker.ts
          docker run -d --name mcp -v lifeos-ci:/data -e LIFEOS_MCP_TOKEN=ci -e LIFEOS_MCP_HOST=0.0.0.0 life-os:ci node_modules/.bin/tsx mcp/server.ts
          sleep 12
          docker logs worker | tee /dev/stderr | grep -q "worker started"
          docker logs mcp | tee /dev/stderr | grep -q "lifeos mcp on"
          docker stats --no-stream --format "{{.Name}}: {{.MemUsage}}" web worker mcp
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Publish multi-arch image (amd64 + arm64, so Raspberry Pi works)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
