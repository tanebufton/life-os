<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LifeOS Voice</title>
<style>
:root{color-scheme:light dark;--bg:#fff;--fg:#1f1f1e;--mute:#706f6b;--line:#e4e3df;--acc:#1877f2;--bad:#d44c47;--ok:#1f845a}
@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#ececea;--mute:#a3a29d;--line:#33332f}}
*{box-sizing:border-box}body{margin:0;padding:16px;font:14px/1.45 system-ui,sans-serif;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;gap:12px;min-height:100vh}
.top{display:flex;align-items:center;gap:12px}#mic{width:56px;height:56px;border-radius:50%;border:0;background:var(--acc);color:#fff;cursor:pointer;display:grid;place-items:center;flex:none}
#mic.on{background:var(--bad);animation:p 1.2s infinite}@keyframes p{50%{opacity:.6}}#mic:disabled{opacity:.4;cursor:default}
#hint{color:var(--mute);font-size:13px}textarea{width:100%;flex:1;min-height:150px;resize:none;padding:10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit;font:inherit;outline:none}textarea:focus{border-color:var(--acc)}
.row{display:flex;gap:8px;flex-wrap:wrap}button.b{padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:transparent;color:inherit;font:inherit;cursor:pointer}button.b.p{background:var(--acc);border-color:var(--acc);color:#fff}button.b:disabled{opacity:.45;cursor:default}
#msg{min-height:20px;font-size:13px}#msg.err{color:var(--bad)}#msg.ok{color:var(--ok)}a{color:var(--acc)}small{color:var(--mute)}
</style></head><body>
<div class="top"><button id="mic" aria-label="Hold to talk" aria-pressed="false" style="touch-action:none;user-select:none"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button><div id="hint">Hold the button and speak.</div></div>
<textarea id="t" placeholder="Your words appear here. You can edit them." aria-label="Transcript"></textarea>
<div class="row"><button class="b p" id="task">Save as task</button><button class="b" id="note">Note</button><button class="b" id="memo">Memo</button><a href="options.html" target="_blank" style="margin-left:auto;align-self:center;font-size:12px">Settings</a></div>
<div id="msg" role="status"></div><small>Hold the button or the Space bar, speak, then let go to add a task. Or type and press Ctrl/⌘ + Enter. Try “call mum tomorrow at 5pm #family”.</small>
<script src="common.js"></script><script src="recorder.js"></script></body></html>
